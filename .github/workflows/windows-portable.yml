name: Windows portable release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows-portable:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run logic and integrity tests
        run: npm test
      - name: Run syntax checks
        run: npm run check
      - name: Run Electron end-to-end smoke test
        run: npm run test:electron
      - name: Build portable executable
        run: npm run dist:win
      - name: Validate portable executable
        shell: pwsh
        run: |
          $executables = @(Get-ChildItem dist -Filter *.exe)
          if ($executables.Count -ne 1) { throw "Expected exactly one portable EXE, found $($executables.Count)" }
          if ($executables[0].Length -lt 10MB) { throw "Portable EXE is unexpectedly small: $($executables[0].Length) bytes" }
          $stream = [System.IO.File]::OpenRead($executables[0].FullName)
          try {
            $first = $stream.ReadByte()
            $second = $stream.ReadByte()
          } finally {
            $stream.Dispose()
          }
          if ($first -ne 0x4d -or $second -ne 0x5a) { throw "Portable asset is not a valid PE executable" }
      - name: Generate SHA-256 checksums
        shell: pwsh
        run: |
          $lines = Get-ChildItem dist -Filter *.exe | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)"
          }
          $content = ($lines -join "`n") + "`n"
          [System.IO.File]::WriteAllText((Join-Path $PWD 'dist/SHA256SUMS.txt'), $content, [System.Text.UTF8Encoding]::new($false))
      - name: Upload verified build artifact
        uses: actions/upload-artifact@v4
        with:
          name: lut-analysis-toolbox-windows-portable
          path: |
            dist/*.exe
            dist/SHA256SUMS.txt
          if-no-files-found: error
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" dist/*.exe dist/SHA256SUMS.txt --verify-tag --title "LUT分析工具箱 ${{ github.ref_name }}" --notes-file RELEASE_NOTES.md
