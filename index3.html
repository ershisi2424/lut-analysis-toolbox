    <style>
        /* P0 同步首页 NOTHIN' 设计系统：覆盖式变量 + 极简导航 + 色调对齐 */
        :root {
            --color-bg: #050505;
            --color-bg-card: #0a0a0a;
            --color-bg-section: #141414;
            --color-text-primary: #f5f5f5;
            --color-text-secondary: #d0d0d0;
            --color-text-muted: #8a8a8a;
            --color-accent: #f5f5f5;
            --color-border: #262626;
            --color-border-light: #1a1a1a;
            --font-body: "Inter", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
            --font-display: "Bebas Neue", "Inter Tight", "Noto Sans SC", Impact, sans-serif;
            --font-mono: "SF Mono", "Fira Code", "Noto Sans SC", monospace;
        }
        body { background: #050505; color: #f5f5f5; font-family: var(--font-body); }
        body > .wrapper { padding-top: 64px; }

        /* 隐藏 loading-overlay（与首页一致） */
        .loading-overlay { display: none !important; }

        /* 首页同款极简导航 */
        .yx-nav {
            position: fixed; top: 0; left: 0; right: 0; z-index: 50;
            display: flex; align-items: center; justify-content: space-between;
            padding: 16px 24px;
            border-bottom: 1px solid rgba(38, 38, 38, 0.5);
            background: rgba(5, 5, 5, 0.8);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }
        .yx-nav-brand {
            font-size: 18px; font-weight: 500; letter-spacing: -0.01em;
            color: #f5f5f5; text-decoration: none;
        }
        .yx-nav-links { display: flex; align-items: center; gap: 32px; }
        .yx-nav-links a {
            font-size: 14px; color: #8a8a8a; text-decoration: none;
            transition: color 0.2s;
        }
        .yx-nav-links a:hover,
        .yx-nav-links a[aria-current="page"] { color: #f5f5f5; }
        .yx-nav-toggle { display: none; }

        /* 隐藏旧 Neve 导航残留（如有） */
        .header--row, .nv-navbar, .header--row-inner { display: none !important; }

        /* 去掉绿色装饰使用 */
        .logo, .nv-html-content a { color: #f5f5f5 !important; text-decoration: none; }

        /* 旧版水印与首页风格不符，弱化 */
        .copyright-watermark, .copyright-footer { color: #8a8a8a; border-color: #262626; }

        /* 重置按钮：NOTHIN' 极简文字风格 */
        .section-title-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 1rem;
        }
        .section-title-row .section-title { margin-bottom: 0; }
        .reset-btn {
            font-family: var(--font-mono);
            font-size: 11px;
            color: #8a8a8a;
            background: none;
            border: none;
            padding: 4px 8px;
            cursor: pointer;
            letter-spacing: 0.04em;
            transition: color 0.2s;
        }
        .reset-btn:hover { color: #f5f5f5; }
        .reset-btn:focus-visible {
            outline: 1px solid #f5f5f5;
            outline-offset: 2px;
        }

        @media (max-width: 768px) {
            .yx-nav-links { display: none; }
            .yx-nav-toggle {
                display: inline-flex; align-items: center; justify-content: center;
                width: 32px; height: 32px; color: #f5f5f5; background: none; border: none; cursor: pointer;
            }
            .yx-nav-toggle svg { width: 20px; height: 20px; }
        }

        /* Password Auth Overlay */
        #auth-overlay {
            position: fixed;
            inset: 0;
            background: #050505;
            z-index: 2147483647;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }
        #auth-overlay .auth-box {
            width: 100%;
            max-width: 360px;
            text-align: center;
        }
        #auth-overlay .auth-lock {
            color: #f5f5f5;
            margin-bottom: 32px;
            display: inline-flex;
        }
        #auth-overlay .auth-title {
            font-family: "Bebas Neue", "Inter Tight", "Noto Sans SC", Impact, sans-serif;
            font-size: 28px;
            font-weight: 400;
            letter-spacing: 0.08em;
            color: #f5f5f5;
            margin: 0 0 8px;
        }
        #auth-overlay .auth-subtitle {
            font-family: "Inter", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
            font-size: 13px;
            color: #8a8a8a;
            margin: 0 0 40px;
            letter-spacing: 0.02em;
        }
        #auth-overlay .auth-form {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        #auth-overlay .auth-input {
            width: 100%;
            background: #0a0a0a;
            border: 1px solid #262626;
            border-radius: 6px;
            color: #f5f5f5;
            font-family: "SF Mono", "Fira Code", "Noto Sans SC", monospace;
            font-size: 14px;
            padding: 12px 14px;
            outline: none;
            transition: border-color 0.2s ease;
            box-sizing: border-box;
        }
        #auth-overlay .auth-input::placeholder {
            color: #555;
        }
        #auth-overlay .auth-input:focus {
            border-color: #f5f5f5;
        }
        #auth-overlay .auth-submit {
            width: 100%;
            background: #f5f5f5;
            border: none;
            border-radius: 6px;
            color: #050505;
            font-family: "Inter", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
            font-size: 13px;
            font-weight: 500;
            padding: 12px;
            cursor: pointer;
            letter-spacing: 0.05em;
            transition: opacity 0.2s ease;
        }
        #auth-overlay .auth-submit:hover {
            opacity: 0.85;
        }
        #auth-overlay .auth-submit.loading {
            opacity: 0.5;
            cursor: not-allowed;
        }
        #auth-overlay .auth-error {
            font-family: "Inter", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
            font-size: 12px;
            color: #8a8a8a;
            margin: 12px 0 0;
            min-height: 0;
            opacity: 0;
            transition: opacity 0.2s ease;
        }
        #auth-overlay .auth-error.show {
            opacity: 1;
            color: #cfcfcf;
        }
        #auth-overlay .auth-footer {
            font-family: "SF Mono", "Fira Code", "Noto Sans SC", monospace;
            font-size: 10px;
            color: #333;
            letter-spacing: 0.3em;
            margin: 40px 0 0;
        }
    </style>

<body class="desktop-app desktop-previewer">

        <nav class="yx-nav" aria-label="主导航">
            <a href="index.html" class="yx-nav-brand">LUT分析工具箱</a>
            <div class="yx-nav-links">

                <a href="index2.html">分析器</a>
                <a href="index3.html" aria-current="page">预览器</a>
            </div>
            <button class="yx-nav-toggle" aria-label="菜单" type="button">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
            </button>
        </nav>

        <main id="content" class="neve-main">
            <div class="container single-page-container">
                <div class="row">
                    <div class="nv-single-page-wrap col">
                        <div class="nv-content-wrap entry-content">
                            <h1 class="wp-block-heading has-text-align-center">LUT 预览与转换</h1>

                            <div id="lut-previewer" class="previewer-card" role="region" aria-label="LUT 预览与转换工具">

                                <!-- 上传区域：双列 -->
                                <div class="upload-row">
                                    <div class="drop-zone" id="drop-zone" role="button" tabindex="0" data-file-trigger="lut-file-input" aria-label="导入 LUT 文件">
                                        <input type="file" id="lut-file-input" accept=".cube,.png" multiple class="drop-zone-input" aria-label="选择 LUT 文件">
                                        <div class="drop-zone-content">
                                            <span class="import-glyph" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3v12m0 0 4-4m-4 4-4-4"/><path d="M5 18v2h14v-2"/></svg></span>
                                            <span class="import-copy"><span class="drop-zone-text">导入 LUT 文件</span><span class="drop-zone-hint">支持批量 .cube / Hald PNG</span></span>
                                            <span class="import-shortcut">Ctrl O</span>
                                        </div>
                                    </div>
                                    <div class="drop-zone drop-zone-image" id="image-drop-zone" role="button" tabindex="0" data-file-trigger="image-file-input" aria-label="导入预览图片">
                                        <input type="file" id="image-file-input" accept="image/*" class="drop-zone-input" aria-label="选择预览图片">
                                        <div class="drop-zone-content">
                                            <span class="import-glyph" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="m4 17 4-4 3 3 3-3 6 5"/></svg></span>
                                            <span class="import-copy"><span class="drop-zone-text">导入预览图片</span><span class="drop-zone-hint">使用你的画面检查 LUT 效果</span></span>
                                        </div>
                                    </div>
                                </div>

                                <!-- 主体：双栏布局 -->
                                <div class="previewer-body" id="previewer-body" style="display:none;">

                                    <!-- 左栏：LUT 列表 -->
                                    <div class="lut-list-section">
                                        <div class="lut-list-header">
                                            <h3 class="section-title">LUT 列表 <span class="lut-count" id="lut-count">0</span></h3>
                                            <button class="lutviz-btn lutviz-btn-sm" id="clear-all-btn" type="button">清空全部</button>
                                        </div>
                                        <div class="lut-list" id="lut-list"></div>
                                    </div>

                                    <!-- 右栏：预览 + 转换 -->
                                    <div class="preview-main">

                                        <!-- 预览区域 -->
                                        <div class="preview-section">
                                            <h3 class="section-title">效果预览</h3>
                                            <div class="preview-controls">
                                                <label class="control-label">
                                                    <span>选择 LUT:</span>
                                                    <select id="preview-lut-select" class="control-select"></select>
                                                </label>
                                                <label class="control-label">
                                                    <span>强度:</span>
                                                    <input type="range" id="intensity-slider" min="0" max="100" value="100" class="control-slider">
                                                    <span id="intensity-value" class="control-value">100%</span>
                                                </label>
                                                <label class="control-label">
                                                    <span>预览图:</span>
                                                    <select id="preview-image-select" class="control-select">
                                                        <option value="granger">Granger 彩虹图</option>
                                                        <option value="gradient">渐变色卡</option>
                                                        <option value="skin">肤色色卡</option>
                                                        <option value="custom">自定义图片</option>
                                                    </select>
                                                </label>
                                            </div>
                                            <div class="preview-canvas-wrap">
                                                <canvas id="preview-canvas" class="preview-canvas" aria-label="LUT 效果预览图"></canvas>
                                            </div>
                                            <div class="preview-hint">拖动分割线对比原图与 LUT 效果 · 自定义图片按原始像素 1:1 处理</div>
                                        </div>

                                        <!-- 转换面板 -->
                                        <div class="convert-section">
                                            <div class="section-title-row">
                                                <h3 class="section-title">重采样与转换</h3>
                                                <button id="reset-convert-btn" type="button" class="reset-btn" aria-label="重置转换参数">重置</button>
                                            </div>
                                            <div class="convert-controls">
                                                <label class="control-label">
                                                    <span>目标 LUT:</span>
                                                    <select id="convert-lut-select" class="control-select"></select>
                                                </label>
                                                <label class="control-label">
                                                    <span>目标尺寸:</span>
                                                    <select id="target-size-select" class="control-select">
                                                        <option value="original">保持原尺寸</option>
                                                        <option value="8">8³ (512 节点)</option>
                                                        <option value="17">17³ (4,913 节点)</option>
                                                        <option value="33">33³ (35,937 节点)</option>
                                                        <option value="65">65³ (274,625 节点)</option>
                                                    </select>
                                                </label>
                                                <label class="control-label">
                                                    <span>插值算法:</span>
                                                    <select id="interpolation-select" class="control-select">
                                                        <option value="tetrahedral" selected>四面体（推荐）</option>
                                                        <option value="trilinear">三线性</option>
                                                        <option value="catmullrom">三三次 Catmull-Rom</option>
                                                    </select>
                                                </label>
                                            </div>

                                            <div class="advanced-settings">
                                                <h4 class="subsection-title">高级调整</h4>
                                                <div class="slider-grid">
                                                    <label class="slider-control">
                                                        <div class="slider-label-row">
                                                            <span>LUT 强度</span>
                                                            <span id="intensity-convert-value" class="slider-value">100%</span>
                                                        </div>
                                                        <input type="range" id="intensity-convert-slider" min="0" max="200" value="100" class="control-slider">
                                                        <div class="slider-hint">0% = 原图 · 100% = 正常 · >100% = 外推</div>
                                                    </label>
                                                    <label class="slider-control">
                                                        <div class="slider-label-row">
                                                            <span>亮度保持</span>
                                                            <span id="luma-preserve-value" class="slider-value">0%</span>
                                                        </div>
                                                        <input type="range" id="luma-preserve-slider" min="0" max="100" value="0" class="control-slider">
                                                        <div class="slider-hint">0% = 完整 LUT · 100% = 仅用 LUT 色度</div>
                                                    </label>
                                                    <label class="slider-control">
                                                        <div class="slider-label-row">
                                                            <span>平滑/去断层</span>
                                                            <span id="smoothing-value" class="slider-value">0%</span>
                                                        </div>
                                                        <input type="range" id="smoothing-slider" min="0" max="100" value="0" class="control-slider">
                                                        <div class="slider-hint">减少色带，最高 20 次拉普拉斯平滑</div>
                                                    </label>
                                                    <label class="slider-control">
                                                        <div class="slider-label-row">
                                                            <span>肤色保护</span>
                                                            <span id="skin-protect-value" class="slider-value">0%</span>
                                                        </div>
                                                        <input type="range" id="skin-protect-slider" min="0" max="100" value="0" class="control-slider">
                                                        <div class="slider-hint">保护暖肤色（~25°色相）不被过度偏移</div>
                                                    </label>
                                                    <label class="slider-control">
                                                        <div class="slider-label-row">
                                                            <span>色域压缩</span>
                                                            <span id="gamut-compress-value" class="slider-value">0%</span>
                                                        </div>
                                                        <input type="range" id="gamut-compress-slider" min="0" max="100" value="0" class="control-slider">
                                                        <div class="slider-hint">超出色域的节点向亮度轴软裁剪</div>
                                                    </label>
                                                </div>
                                            </div>

                                            <div class="png-settings">
                                                <h4 class="subsection-title">PNG 导出设置</h4>
                                                <div class="convert-controls">
                                                    <label class="control-label">
                                                        <span>HaldCLUT 级别:</span>
                                                        <select id="png-level-select" class="control-select">
                                                            <option value="3">Level 3 · 27×27 · 9³ = 729</option>
                                                            <option value="4">Level 4 · 64×64 · 16³ = 4,096</option>
                                                            <option value="5">Level 5 · 125×125 · 25³ = 15,625</option>
                                                            <option value="8" selected>Level 8 · 512×512 · 64³ = 262,144</option>
                                                        </select>
                                                    </label>
                                                    <div class="slider-hint">标准 ImageMagick Hald 排列 · PNG 为 8 位 RGB，超出 0–1 的值会裁切；需要保留扩展范围请导出 CUBE</div>
                                                </div>
                                            </div>

                                            <div class="convert-actions">
                                                <button class="lutviz-btn" id="export-cube-btn" type="button">导出 CUBE</button>
                                                <button class="lutviz-btn" id="export-png-btn" type="button">导出 PNG (HaldCLUT)</button>
                                                <button class="lutviz-btn" id="export-all-cube-btn" type="button">批量导出 CUBE</button>
                                                <button class="lutviz-btn" id="export-all-png-btn" type="button">批量导出 PNG</button>
                                            </div>
                                            <div class="convert-info" id="convert-info"></div>
                                        </div>

                                    </div>
                                </div>

                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
        if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
            navigator.serviceWorker.register('./sw.js')
                .then(function(registration) {
                    console.log('Service Worker registered with scope:', registration.scope);
                })
                .catch(function(error) {
                    console.log('Service Worker registration failed:', error);
                });
        }
    </script>
    <script>
        (function() {
            'use strict';
            var resetButton = document.getElementById('reset-convert-btn');
            if (!resetButton) return;
            var defaults = {
                'target-size-select': 'original',
                'interpolation-select': 'tetrahedral',
                'intensity-convert-slider': '100',
                'luma-preserve-slider': '0',
                'smoothing-slider': '0',
                'skin-protect-slider': '0',
                'gamut-compress-slider': '0',
                'png-level-select': '8'
            };
            resetButton.addEventListener('click', function() {
                Object.keys(defaults).forEach(function(id) {
                    var element = document.getElementById(id);
                    if (!element) return;
                    element.value = defaults[id];
                    element.dispatchEvent(new Event(element.matches('select') ? 'change' : 'input', { bubbles: true }));
                });
            });
        })();
    </script>
